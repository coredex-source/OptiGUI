[versions]
java = "25" # Don't forget to update *.mixins.json
kotlin = "2.4.0"
optigui = "2.3.0-alpha.1+neoforge.26.3"
minecraft = "26.3"
neoforge = "26.3.0.99"
moddev = "2.0.148"
kotlinforforge = "6.4.0"
commons-text = "1.12.0"
ini4j = "0.5.4"
dokka = "2.2.0"

[libraries]
kotlinforforge = { group = "thedarkcolour", name = "kotlinforforge-neoforge", version.ref = "kotlinforforge" }
apache-commons-text = { group = "org.apache.commons", name = "commons-text", version.ref = "commons-text" }
ini4j = { group = "org.ini4j", name = "ini4j", version.ref = "ini4j" }
dokka-base = { group = "org.jetbrains.dokka", name = "dokka-base", version.ref = "dokka" }
dokka-plugin-java-syntax = { group = "org.jetbrains.dokka", name = "kotlin-as-java-plugin", version.ref = "dokka" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
